<div>
    <div class="w-4/5 m-auto p-[50px]">
        <div class="flex items-center justify-center">
            <input nz-input placeholder="Tìm kiếm theo tên lớp" style="width:400px" [(ngModel)]="searchStringInput" />
            <button type="button" nz-button nzType="primary" (click)="searchInput()">Tìm kiếm</button>
            <button type="button" nz-button nzType="primary" (click)="themLop()" class="ml-2">Thêm mới</button>
            <button type="button" nz-button nzType="primary" (click)="goToQLLop()" class="ml-2">Quản lý người dùng trong lớp</button>
        </div>

        <div class="mt-2">
            <nz-table #basicTable [nzData]="listLopTable" nzShowPagination nzShowSizeChanger [nzTotal]="totalItems"
                [nzPageSize]="pageSize" [nzTotal]="totalItems" (nzPageIndexChange)="pageIndexChange($event)"
                (nzPageSizeChange)="pageSizeChange($event)">
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Mã lớp</th>
                        <th>Tên lớp</th>
                        <th>Công cụ</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let data of basicTable.data">
                        <td>{{data.id}}</td>
                        <td>{{data.maLop}}</td>
                        <td>{{data.tenLop}}</td>
                        <td>
                            <button nz-button nzType="text" (click)="suaLop(data)">Sửa</button>
                            <button nz-button nzType="text" class="text-red-600"
                                (click)="xoaLop(data.id)">Xóa</button>

                        </td>
                        <!-- <td>{{data.ngaySinh}}</td> -->
                    </tr>
                </tbody>
            </nz-table>
        </div>

    </div>
</div>
