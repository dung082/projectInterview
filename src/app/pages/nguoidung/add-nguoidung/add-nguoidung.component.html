<form [formGroup]="addForm" (submit)="addNguoiDung()">
    <div class="text-center">
        Thêm người dùng mới
    </div>

    <div>
        <span>Họ và tên</span>
        <div>
            <input nz-input placeholder="Nhập họ và tên" formControlName="hoTen" />
        </div>
    </div>

    <div class="mt-2">
        <span>Địa chỉ</span>
        <div>
            <input nz-input placeholder="Nhập địa chỉ" formControlName="diaChi" />
        </div>
    </div>

    <div class="mt-2">
        <span>Giới tính</span>
        <div>
            <nz-select formControlName="gioiTinh" class="w-full">
                <nz-option [nzValue]="0" nzLabel="Nữ"></nz-option>
                <nz-option [nzValue]="1" nzLabel="Nam"></nz-option>
            </nz-select>
        </div>
    </div>

    <div class="mt-2">
        <span>Ngày sinh</span>
        <div>
            <nz-date-picker formControlName="ngaySinh" class="w-full"></nz-date-picker>
        </div>
    </div>
    <div class="mt-2 text-center">
        <button nz-button nzType="default" type="button" (click)="closeModal()">Đóng </button>
        <button nz-button nzType="primary" type="submit" class="ml-2">Thêm người dùng </button>
    </div>
</form>
