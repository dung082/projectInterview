<div>
    <div class="w-4/5 m-auto p-[50px]">
        <div class="flex items-center justify-center">
            <input nz-input placeholder="Basic usage" style="width:400px" [(ngModel)]="searchStringInput" />
            <button type="button" nz-button nzType="primary" (click)="searchInput()">Tìm kiếm </button>
            <button type="button" nz-button nzType="primary" class="ml-2" (click)="themNguoiDung()">Thêm người dùng
            </button>

        </div>

        <div class="mt-2">
            <nz-table #basicTable [nzData]="listNguoiDungTable" nzShowPagination nzShowSizeChanger
                [nzPageIndex]="pageNumber" [nzPageSize]="pageSize" [nzTotal]="totalItems"
                (nzPageIndexChange)="pageIndexChange($event)" (nzPageSizeChange)="pageSizeChange($event)">
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Họ và tên</th>
                        <th>Địa chỉ</th>
                        <th>Ngày sinh</th>
                        <th>Công cụ</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let data of basicTable.data">
                        <td>{{data.id}}</td>
                        <td>{{data.hoTen}}</td>
                        <td>{{data.diaChi}}</td>
                        <td>{{data.ngaySinh}}</td>
                        <td>
                            <button nz-button nzType="text" (click)="suaNguoiDung(data)">Sửa</button>
                            <button nz-button nzType="text" class="text-red-600"
                                (click)="xoaNguoiDung(data.id)">Xóa</button>

                        </td>
                    </tr>
                </tbody>
            </nz-table>
        </div>

    </div>
</div>
